apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: payment-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      tolerations:
      - key: "security"
        operator: "Equal"
        value: "high"
        effect: "NoSchedule"

      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80